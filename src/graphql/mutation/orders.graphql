# ===== MUTATIONS CORRECTAS CON CAMPOS REALES =====
mutation CreateOrder($data: OrderInput!) {
  createOrder(data: $data) {
    documentId
    orderNumber
    status
    subtotal
    totalAmount
    orderDate
    createdAt
    updatedAt
    cliente {
      documentId
      firstName
      lastName
      email
    }
  }
}

mutation UpdateOrder($documentId: ID!, $data: OrderInput!) {
  updateOrder(documentId: $documentId, data: $data) {
    documentId
    orderNumber
    status
    subtotal
    totalAmount
    taxAmount
    shippingCost
    discountAmount
    updatedAt
  }
}

# ===== MUTATIONS DE CLIENTES =====
mutation CreateCliente($data: ClienteInput!) {
  createCliente(data: $data) {
